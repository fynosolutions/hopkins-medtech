<html><head><script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","@id":"http://localhost:3000/#organization","name":"Hopkins MedTech Compliance","legalName":"Hopkins MedTech Group LLC","alternateName":["Hopkins MedTech Compliance","HMC"],"url":"http://localhost:3000/","logo":"http://localhost:3000/media/2d264def-20220223150835.png","telephone":"+1 800 320 1438","email":"HomerWu@HopkinsMedtech.com","address":{"@type":"PostalAddress","streetAddress":"5 Penn Plaza, 19th Floor","addressLocality":"New York","addressRegion":"NY","postalCode":"10001","addressCountry":"US"},"sameAs":["https://www.linkedin.com/company/hopkins-cro"],"founder":[{"@type":"Person","@id":"http://localhost:3000/about/team/jeff-wu#person","name":"Jeff Wu","sameAs":["https://www.linkedin.com/in/jeffwu774/"]}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","@id":"http://localhost:3000/careers/data-science-intern#job","url":"http://localhost:3000/careers/data-science-intern","title":"Data Science Intern, Dataset Curation & Model Evaluation","identifier":{"@type":"PropertyValue","name":"Hopkins MedTech Group LLC","value":"JD-HMT-B02"},"employmentType":"INTERN","hiringOrganization":{"@id":"http://localhost:3000/#organization"},"description":"\u003cp>Educational partner referral. Candidates apply through their education partner with a CV and short note, followed by a conversation with the project lead.\u003c/p>\u003cp>Work arrangement: Remote / Onsite.\u003c/p>\u003cp>Key To Terms Used\u003c/p>\u003cp>ANNOTATION Human-assigned labels on data. The definition matters more than the tool.\u003c/p>\u003cp>AGREEMENT How often two independent annotators give the same label to the same item.\u003c/p>\u003cp>SPLIT Keeping training and test data separate so that results are not self-congratulatory.\u003c/p>\u003cp>SUBGROUP Performance reported per group, rather than one average that hides a failure.\u003c/p>\u003cp>LICENSE The terms under which a dataset may legally be used, including for commercial work.\u003c/p>\u003cp>THRESHOLD The success bar set before results exist, and not moved afterwards.\u003c/p>\u003cp>Intended Role\u003c/p>\u003cp>Before a health AI model can be trusted, someone has to define what the data means and what counts as good enough. This role does that upstream work. You will survey available datasets and their licenses, design annotation schemas, and build the evaluation framework the project will be judged against. The emphasis is on defining measurement honestly before results exist, not on chasing a headline accuracy number.\u003c/p>\u003cp>Principal Duties\u003c/p>\u003cp>– Survey publicly available image and health datasets, documenting content, licensing terms, and stated limitations.\u003c/p>\u003cp>– Assess dataset representativeness across demographics, capture conditions, and label quality, and state gaps plainly.\u003c/p>\u003cp>– Design annotation schemas and written labeling guidelines that two independent annotators could apply consistently.\u003c/p>\u003cp>– Measure annotation agreement, and revise guidelines where disagreement shows the definition is ambiguous.\u003c/p>\u003cp>– Define the evaluation framework, including metrics, splits, baselines, and success thresholds, before any comparison.\u003c/p>\u003cp>– Run subgroup and bias analyses so that reported performance is not an average hiding an unacceptable failure.\u003c/p>\u003cp>– Use approved AI tools for exploration and drafting, then verify all dataset claims against the original documentation.\u003c/p>\u003cp>Example Assignments\u003c/p>\u003cp>Assignments depend on active studies, authorized data access, and the internship timeline. Examples may include: – A dataset review with licensing, representativeness, and suitability recommendations\u003c/p>\u003cp>– An annotation schema and labeling guideline with an inter- annotator agreement study\u003c/p>\u003cp>– An evaluation framework defining metrics, baselines, splits, and subgroup reporting requirements\u003c/p>\u003cp>Your First Two Weeks\u003c/p>\u003cp>– Survey candidate datasets and record content, license terms, and stated limitations.\u003c/p>\u003cp>– Draft the first annotation guideline and label a pilot set yourself.\u003c/p>\u003cp>– Run a two-annotator pilot and measure how often the labels agree.\u003c/p>\u003cp>– Propose the metrics, splits, and success thresholds before any model is compared.\u003c/p>\u003cp>About Hopkins Medtech\u003c/p>\u003cp>Hopkins MedTech Group LLC is a U.S. company working in medical technology and in vitro diagnostics. Its work covers clinical performance studies, protocol development and site coordination, data review and quality assurance, and regulatory support for United States and European pathways. The group is also exploring AI and digital health through an early-stage research initiative in facial and skin analysis.\u003c/p>\u003cp>Required Qualifications\u003c/p>\u003cp>– Currently pursuing, or recently completed, a degree in data science, statistics, computer science, public health, or a related field, or able to show equivalent self-study or project work.\u003c/p>\u003cp>– Working Python or R skills for data handling, analysis, and visualization from coursework or personal projects.\u003c/p>\u003cp>– Understanding of evaluation fundamentals such as train and test separation, baselines, and the difference between accuracy and usefulness.\u003c/p>\u003cp>– The rigor to define success criteria before seeing results, and to leave them unchanged afterward.\u003c/p>\u003cp>– Careful reading of licensing and consent terms, and the discipline to respect authorized data boundaries.\u003c/p>\u003cp>– No prior data science, research lab, or professional internship experience is required.\u003c/p>\u003cp>Preferred Qualifications\u003c/p>\u003cp>Not screening criteria. Coursework, labs, personal projects, and self- study all count as evidence. – Coursework or self-study in machine learning, experimental design, epidemiology, or measurement theory\u003c/p>\u003cp>– Experience labeling or cleaning a dataset and discovering how ambiguous a definition can be\u003c/p>\u003cp>– Awareness of algorithmic fairness literature, especially in health and dermatology contexts\u003c/p>\u003cp>What You Will Gain\u003c/p>\u003cp>– Learn the part of AI work that decides whether any later result means anything.\u003c/p>\u003cp>– Practice writing definitions precise enough that two people reach the same label.\u003c/p>\u003cp>– Understand how subgroup performance and dataset bias become clinical and regulatory concerns.\u003c/p>\u003cp>– Leave with an evaluation framework and agreement study that demonstrate real methodological maturity.\u003c/p>\u003cp>Deliverables\u003c/p>\u003cp>– A dataset review with licensing and representativeness findings\u003c/p>\u003cp>– An annotation guideline plus an inter-annotator agreement report\u003c/p>\u003cp>– A written evaluation framework with metrics, baselines, and subgroup requirements\u003c/p>\u003cp>Supervision And Evaluation\u003c/p>\u003cp>Interns report to a named project lead, meet on a set weekly cadence, and receive written feedback on each deliverable. Work is evaluated on accuracy and traceability of sources, documentation quality, responsiveness to feedback, judgment about what to escalate, and disciplined use of approved AI tools. We expect steady learning and iteration rather than polished perfection on the first day.\u003c/p>\u003cp>What We Do Not Expect\u003c/p>\u003cp>– Prior internship experience, or a name-brand employer on your CV.\u003c/p>\u003cp>– Knowing the regulations, tools, or vocabulary before you start; the terms box above is where most people begin.\u003c/p>\u003cp>– Certainty. Saying what the evidence does not support is treated as a strength, not a gap.\u003c/p>\u003cp>Application And Selection\u003c/p>\u003cp>Candidates are referred through our education partners. An application is a CV plus a short note naming the track you want and one project from this document you would like to work on, and why. First-round interviews are with the project lead who would supervise the work, not with a screening panel.\u003c/p>\u003cp>Data Handling, Privacy, And Responsible Ai\u003c/p>\u003cp>Interns work only with data and documents they have been explicitly authorized to access. Patient-identifiable information, study data, client- confidential files, and proprietary materials must never be uploaded to public or unapproved AI services, shared outside the project team, or stored on personal accounts or devices. AI tools may be used only\u003c/p>\u003cp>where the project lead has approved them for that task, and all AI- assisted work must be independently verified before it enters any deliverable. The intern and the project lead remain accountable for the final result.\u003c/p>\u003cp>Equal Opportunity &amp; Educational Nature\u003c/p>\u003cp>Hopkins MedTech Group LLC provides equal internship and employment opportunities without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability, veteran status, or any other legally protected characteristic. Internships are educational in nature; interns do not provide medical advice, make regulatory determinations, or represent the company to any health authority, client, or study site. The AI and digital health initiative described here is early-stage research, not a cleared, approved, or clinically validated product. Assignments, data access, duration, and supervision are confirmed in the final project description.\u003c/p>"}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","@id":"http://localhost:3000/careers/healthcare-market-research-intern#job","url":"http://localhost:3000/careers/healthcare-market-research-intern","title":"Healthcare Market Research Intern, Digital Health Commercialization","identifier":{"@type":"PropertyValue","name":"Hopkins MedTech Group LLC","value":"JD-HMT-B04"},"employmentType":"INTERN","hiringOrganization":{"@id":"http://localhost:3000/#organization"},"description":"\u003cp>Educational partner referral. Candidates apply through their education partner with a CV and short note, followed by a conversation with the project lead.\u003c/p>\u003cp>Work arrangement: Remote / Onsite.\u003c/p>\u003cp>Key To Terms Used\u003c/p>\u003cp>TAM Total addressable market. Every possible buyer, before any realism is applied.\u003c/p>\u003cp>BOTTOM-UP Sizing built from units and prices you can source, not from a headline industry figure.\u003c/p>\u003cp>CHANNEL The route a product reaches a buyer: direct, clinic partnership, retail, or licensing.\u003c/p>\u003cp>A positioning choice that changes evidence burden, cost, and time to market.\u003c/p>\u003cp>WELLNESS / MEDICAL\u003c/p>\u003cp>SENSITIVITY Showing how the answer moves when the least certain assumption changes.\u003c/p>\u003cp>REIMBURSEMENT Whether an insurer pays. It often decides whether a health product has a business.\u003c/p>\u003cp>Intended Role\u003c/p>\u003cp>An early-stage concept needs a defensible answer to who would pay, how much, and through which channel. This role builds that answer from public evidence. You will size the market from the bottom up, map competitors and channels, and assess which commercialization paths are realistic given regulatory and cost constraints. The emphasis is on traceable assumptions, not on optimistic totals.\u003c/p>\u003cp>Principal Duties\u003c/p>\u003cp>– Build bottom-up market sizing models where each assumption is stated, sourced, and independently adjustable.\u003c/p>\u003cp>– Map the competing products across consumer apps, clinical tools, device makers, and skincare brands.\u003c/p>\u003cp>– Research channel options such as direct to consumer, clinic and dermatology partnerships, retail, and licensing.\u003c/p>\u003cp>– Analyze pricing and business models in comparable products, including subscription, per-use, and bundled offers.\u003c/p>\u003cp>– Summarize how regulatory positioning, wellness versus medical, changes the cost and speed of each route.\u003c/p>\u003cp>– Maintain a sourced research log so any number in a deck can be traced back to its origin within one click.\u003c/p>\u003cp>– Use approved AI tools to accelerate research and drafting, then verify every figure against the primary source.\u003c/p>\u003cp>Example Assignments\u003c/p>\u003cp>Assignments depend on active studies, authorized data access, and the internship timeline. Examples may include: – A bottom-up market sizing model with a sensitivity analysis on the three assumptions that matter most\u003c/p>\u003cp>– A competitor and sales-channel comparison with positioning, pricing, and claim comparisons\u003c/p>\u003cp>– A commercialization pathway assessment comparing routes on cost, speed, evidence burden, and risk\u003c/p>\u003cp>Your First Two Weeks\u003c/p>\u003cp>– Assemble the source list: industry data, filings, pricing pages, and public health statistics.\u003c/p>\u003cp>– Build the first bottom-up sizing model with every assumption stated and sourced.\u003c/p>\u003cp>– Map ten comparable products by positioning, price, channel, and claims made.\u003c/p>\u003cp>– Write the one-page question list: what we must know before choosing a commercial route.\u003c/p>\u003cp>About Hopkins Medtech\u003c/p>\u003cp>Hopkins MedTech Group LLC is a U.S. company working in medical technology and in vitro diagnostics. Its work covers clinical performance studies, protocol development and site coordination, data review and quality assurance, and regulatory support for United States and European pathways. The group is also exploring AI and digital health through an early-stage research initiative in facial and skin analysis.\u003c/p>\u003cp>Required Qualifications\u003c/p>\u003cp>– Currently pursuing, or recently completed, a degree in business, economics, public health, health administration, marketing, or a related field, or able to show equivalent self-study or project work.\u003c/p>\u003cp>– Solid spreadsheet skills, including building a model whose assumptions someone else can change and re-run.\u003c/p>\u003cp>– Strong written English and the ability to make a structured, evidence-based argument in a short document.\u003c/p>\u003cp>– Rigorous sourcing habits, including the willingness to label an estimate as an estimate.\u003c/p>\u003cp>– Comfort researching regulated healthcare markets where claims and evidence requirements shape economics.\u003c/p>\u003cp>– No prior market research, consulting, or professional internship experience is required.\u003c/p>\u003cp>Preferred Qualifications\u003c/p>\u003cp>Not screening criteria. Coursework, labs, personal projects, and self- study all count as evidence. – A course or competition project involving market sizing, a business case, or a pitch\u003c/p>\u003cp>– Exposure to healthcare reimbursement, consumer health markets, or dermatology and skincare categories\u003c/p>\u003cp>– Familiarity with research sources such as industry reports, company filings, or public health statistics\u003c/p>\u003cp>What You Will Gain\u003c/p>\u003cp>– Learn to size a market from the bottom up, where every assumption has to survive a question.\u003c/p>\u003cp>– Understand how regulatory positioning changes the economics of a health product.\u003c/p>\u003cp>– Practice building analysis that an executive can challenge line by line and still trust.\u003c/p>\u003cp>– Leave with a sourced market model and pathway assessment you can defend in an interview.\u003c/p>\u003cp>Deliverables\u003c/p>\u003cp>– A sourced market sizing model with documented assumptions and sensitivity ranges\u003c/p>\u003cp>– A competitor and sales-channel comparison with pricing and positioning comparisons\u003c/p>\u003cp>– A commercialization pathway memo with a recommendation and its stated conditions\u003c/p>\u003cp>Supervision And Evaluation\u003c/p>\u003cp>Interns report to a named project lead, meet on a set weekly cadence, and receive written feedback on each deliverable. Work is evaluated on accuracy and traceability of sources, documentation quality, responsiveness to feedback, judgment about what to escalate, and disciplined use of approved AI tools. We expect steady learning and iteration rather than polished perfection on the first day.\u003c/p>\u003cp>What We Do Not Expect\u003c/p>\u003cp>– Prior internship experience, or a name-brand employer on your CV.\u003c/p>\u003cp>– Knowing the regulations, tools, or vocabulary before you start; the terms box above is where most people begin.\u003c/p>\u003cp>– Certainty. Saying what the evidence does not support is treated as a strength, not a gap.\u003c/p>\u003cp>Application And Selection\u003c/p>\u003cp>Candidates are referred through our education partners. An application is a CV plus a short note naming the track you want and one project from this document you would like to work on, and why. First-round interviews are with the project lead who would supervise the work, not with a screening panel.\u003c/p>\u003cp>Data Handling, Privacy, And Responsible Ai\u003c/p>\u003cp>Interns work only with data and documents they have been explicitly authorized to access. Patient-identifiable information, study data, client- confidential files, and proprietary materials must never be uploaded to public or unapproved AI services, shared outside the project team, or stored on personal accounts or devices. AI tools may be used only\u003c/p>\u003cp>where the project lead has approved them for that task, and all AI- assisted work must be independently verified before it enters any deliverable. The intern and the project lead remain accountable for the final result.\u003c/p>\u003cp>Equal Opportunity &amp; Educational Nature\u003c/p>\u003cp>Hopkins MedTech Group LLC provides equal internship and employment opportunities without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability, veteran status, or any other legally protected characteristic. Internships are educational in nature; interns do not provide medical advice, make regulatory determinations, or represent the company to any health authority, client, or study site. The AI and digital health initiative described here is early-stage research, not a cleared, approved, or clinically validated product. Assignments, data access, duration, and supervision are confirmed in the final project description.\u003c/p>"}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","@id":"http://localhost:3000/resources/hmc-questions-fda-town-halls-2022#article","url":"http://localhost:3000/resources/hmc-questions-fda-town-halls-2022","mainEntityOfPage":"http://localhost:3000/resources/hmc-questions-fda-town-halls-2022","headline":"HMC questions in the FDA’s 2022 IVD town halls","description":"Public transcripts document questions about respiratory diagnostic studies, sample handling and home collection.","inLanguage":"en","publisher":{"@id":"http://localhost:3000/#organization"},"isBasedOn":{"@type":"Article","headline":"HMC questions in the FDA’s 2022 IVD town halls","url":"https://www.linkedin.com/feed/update/urn:li:activity:7513130950092865536/","datePublished":"2026-10-06","creditText":"Original source authors: Hopkins MedTech Compliance","publisher":{"@type":"Organization","name":"Hopkins MedTech Compliance"}},"citation":[{"@type":"Article","headline":"HMC questions in the FDA’s 2022 IVD town halls","url":"https://www.linkedin.com/feed/update/urn:li:activity:7513130950092865536/","datePublished":"2026-10-06","creditText":"Original source authors: Hopkins MedTech Compliance","publisher":{"@type":"Organization","name":"Hopkins MedTech Compliance"}},{"@type":"CreativeWork","name":"FDA IVD town hall — 18 May 2022","url":"https://www.fda.gov/media/158755/download"},{"@t @context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/clinical-operations#service","url":"http://localhost:3000/services/clinical-operations","name":"Clinical Operations","description":"HMC supports clinical study sponsors with site start-up, monitoring and study-document coordination under applicable good clinical practice (GCP) requirements. Work includes trial master file (TMF) and informed consent form (ICF) documentation where specified.","serviceType":"Clinical Trials","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/clinical-study#service","url":"http://localhost:3000/services/clinical-study","name":"Clinical study","description":"HMC supports medical device and in vitro diagnostic (IVD) companies with clinical performance study planning, operations and analysis for product-specific FDA or European submission requirements.","serviceType":"Clinical Trials","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/data-management#service","url":"http://localhost:3000/services/data-management","name":"Data Management","description":"HMC supports clinical study sponsors with data management plans, case report forms (CRFs), data review and database-lock preparation. Work follows the study protocol and applicable data standards.","serviceType":"Clinical Trials","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/eua-application#service","url":"http://localhost:3000/services/eua-application","name":"EUA Application","description":"HMC supports developers preparing Emergency Use Authorization (EUA) materials for medical products. Eligibility, submission scope and authorization depend on the applicable FDA emergency framework.","serviceType":"FDA Regulatory Consulting","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/facility-registration-listing#service","url":"http://localhost:3000/services/facility-registration-listing","name":"Facility Registration and Listing","description":"HMC supports medical device and IVD establishments with FDA establishment registration and device listing. These administrative requirements are distinct from product-specific premarket clearance or approval.","serviceType":"FDA Regulatory Consulting","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/fda-regulatory-consulting#service","url":"http://localhost:3000/services/fda-regulatory-consulting","name":"FDA Regulatory Consulting","description":"HMC supports medical product companies with FDA development planning and submission preparation. Services are scoped to the product and applicable pathway, including 510(k), De Novo, premarket approval (PMA) or Emergency Use Authorization (EUA).","serviceType":"FDA Regulatory Consulting","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/fda-us-agent#service","url":"http://localhost:3000/services/fda-us-agent","name":"FDA US Agent","description":"HMC offers FDA US agent support for foreign establishments and assistance with registration-related communication. The applicable appointment and registration requirements depend on the establishment and product category.","serviceType":"FDA Regulatory Consulting","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/food-dietary-supplements#service","url":"http://localhost:3000/services/food-dietary-supplements","name":"Food and Dietary Supplements","description":"HMC supports food and dietary supplement businesses with FDA facility registration, labeling review and applicable import requirements, including Foreign Supplier Verification Programs (FSVP). Scope depends on the product and business role.","serviceType":"IVD & Device Compliance","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/ivdr#service","url":"http://localhost:3000/services/ivdr","name":"European IVDR","description":"HMC supports in vitro diagnostic manufacturers with technical documentation and quality-system planning under the European In Vitro Diagnostic Medical Devices Regulation (IVDR). The work supports applicable conformity assessment and CE marking preparation.","serviceType":"IVD & Device Compliance","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/laboratory-services#service","url":"http://localhost:3000/services/laboratory-services","name":"Laboratory Services","description":"HMC coordinates laboratory support for diagnostic projects through associated businesses and partners. The laboratory provider, validation scope and applicable quality requirements are confirmed for each engagement.","serviceType":"Laboratory Services","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/market-research#service","url":"http://localhost:3000/services/market-research","name":"Market Research","description":"HMC supports medical technology companies reviewing target markets and commercialization requirements. Research scope is defined around the product category, market and regulatory questions that need investigation.","serviceType":"Market Entry","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/marketing#service","url":"http://localhost:3000/services/marketing","name":"Marketing","description":"HMC supports medical device businesses with market information, branding and distributor outreach for US market entry. Product claims and promotional scope require product-specific review.","serviceType":"Market Entry","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/medical-device-510k#service","url":"http://localhost:3000/services/medical-device-510k","name":"Medical Device 510(k)","description":"HMC supports medical device companies preparing FDA 510(k) premarket notifications and related regulatory documentation. The submission route and evidence requirements depend on the device and its intended use.","serviceType":"FDA Regulatory Consulting","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/otc-drug#service","url":"http://localhost:3000/services/otc-drug","name":"OTC Drug","description":"HMC supports over-the-counter (OTC) drug companies with FDA establishment registration, product listing and submission documentation, including structured product labeling (SPL). The applicable requirements depend on the product.","serviceType":"IVD & Device Compliance","provider":{"@id":"http://localhost:3000/#organization"}}</script><scri t","description":"HMC supports medical technology companies with product development planning and evidence requirements for the intended market. Regulatory preparation is scoped to the product and its proposed submission route.","serviceType":"IVD & Device Compliance","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/project-management#service","url":"http://localhost:3000/services/project-management","name":"Project Management","description":"HMC supports clinical study sponsors with study plans, coordination and progress reporting. Project responsibilities and documentation are aligned with the study protocol and applicable good clinical practice (GCP) requirements.","serviceType":"Clinical Trials","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/quality-assurance#service","url":"http://localhost:3000/services/quality-assurance","name":"Quality Assurance","description":"HMC supports clinical study teams with process assessments, audit planning and documentation of findings. The review scope follows the study requirements and applicable good clinical practice (GCP) standards.","serviceType":"Clinical Trials","provider":{"@id":"http://localhost:3000/#organization"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","@id":"http://localhost:3000/services/quality-system#service","url":"http://localhost:3000/services/quality-system","name":"Quality Systems","description":"HMC supports medical device companies with quality management system documentation under FDA QMSR, 21 CFR Part 820 and ISO 13485, as applicable. Scope includes assessment, action planning and supporting records.","serviceType":"IVD & Device Compliance","provider":{"@id":"http://local
